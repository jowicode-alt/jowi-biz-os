name: Deploy InterCampus billing Worker
on:
  push:
    branches: [main]
    paths:
      - "billing-worker/**"
      - ".github/workflows/deploy-billing-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check deployment secrets
        id: secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOWI_BIZ_OS }}
          JJUMA_SECRET_KEY: ${{ secrets.JJUMA_SECRET_KEY }}
          JJUMA_WEBHOOK_SECRET: ${{ secrets.JJUMA_WEBHOOK_SECRET }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$JJUMA_SECRET_KEY" ] || [ -z "$JJUMA_WEBHOOK_SECRET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Worker deployment skipped. Add the five required GitHub Actions secrets described in billing-worker/README.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Worker dependencies
        if: steps.secrets.outputs.ready == 'true'
        working-directory: billing-worker
        run: npm install
      - name: Upload private Worker secrets and deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: billing-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOWI_BIZ_OS }}
          JJUMA_SECRET_KEY: ${{ secrets.JJUMA_SECRET_KEY }}
          JJUMA_WEBHOOK_SECRET: ${{ secrets.JJUMA_WEBHOOK_SECRET }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
          printf '%s' "$JJUMA_SECRET_KEY" | npx wrangler secret put JJUMA_SECRET_KEY
          printf '%s' "$JJUMA_WEBHOOK_SECRET" | npx wrangler secret put JJUMA_WEBHOOK_SECRET
          npx wrangler deploy