name: Deploy InterCampus billing Worker
on:
  push:
    branches: [main]
    paths:
      - "billing-worker/**"
      - ".github/workflows/deploy-billing-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Worker dependencies
        working-directory: billing-worker
        run: npm install
      - name: Upload private Worker secrets
        working-directory: billing-worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOWI_BIZ_OS }}
          JJUMA_SECRET_KEY: ${{ secrets.JJUMA_SECRET_KEY }}
          JJUMA_WEBHOOK_SECRET: ${{ secrets.JJUMA_WEBHOOK_SECRET }}
        run: |
          test -n "$CF_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$FIREBASE_SERVICE_ACCOUNT" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JOWI_BIZ_OS" && exit 1)
          test -n "$JJUMA_SECRET_KEY" || (echo "Missing JJUMA_SECRET_KEY" && exit 1)
          test -n "$JJUMA_WEBHOOK_SECRET" || (echo "Missing JJUMA_WEBHOOK_SECRET" && exit 1)
          export CLOUDFLARE_API_TOKEN="$CF_API_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
          printf '%s' "$JJUMA_SECRET_KEY" | npx wrangler secret put JJUMA_SECRET_KEY
          printf '%s' "$JJUMA_WEBHOOK_SECRET" | npx wrangler secret put JJUMA_WEBHOOK_SECRET
          npx wrangler deploy
