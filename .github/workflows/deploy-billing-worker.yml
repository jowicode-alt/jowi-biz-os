name: Deploy InterCampus billing Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check deployment configuration
        id: config
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JJUMA_PUBLIC_KEY: ${{ secrets.JJUMA_PUBLIC_KEY }}
          JJUMA_SECRET_KEY: ${{ secrets.JJUMA_SECRET_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOWI_BIZ_OS }}
          SMS_ENCRYPTION_KEY: ${{ secrets.INTERCAMPUS_SMS_ENCRYPTION_KEY }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$JJUMA_PUBLIC_KEY" ] || [ -z "$JJUMA_SECRET_KEY" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped. Cloudflare API token, account ID, JJuma keys and Firebase service-account credential are required."
          elif grep -q "CREATE_D1_DATABASE_FIRST" billing-worker/wrangler.toml; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped. Create the Cloudflare D1 database, then replace database_id in billing-worker/wrangler.toml."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Worker dependencies
        if: steps.config.outputs.ready == 'true'
        working-directory: billing-worker
        run: npm install
      - name: Apply D1 migrations
        if: steps.config.outputs.ready == 'true'
        working-directory: billing-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply intercampus-billing --remote
      - name: Deploy Worker with protected secrets
        if: steps.config.outputs.ready == 'true'
        working-directory: billing-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JJUMA_PUBLIC_KEY: ${{ secrets.JJUMA_PUBLIC_KEY }}
          JJUMA_SECRET_KEY: ${{ secrets.JJUMA_SECRET_KEY }}
          JJUMA_WEBHOOK_SECRET: ${{ secrets.JJUMA_WEBHOOK_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOWI_BIZ_OS }}
          SMS_ENCRYPTION_KEY: ${{ secrets.INTERCAMPUS_SMS_ENCRYPTION_KEY }}
        run: |
          node -e 'const fs=require("fs");const s={JJUMA_PUBLIC_KEY:process.env.JJUMA_PUBLIC_KEY,JJUMA_SECRET_KEY:process.env.JJUMA_SECRET_KEY,FIREBASE_SERVICE_ACCOUNT_JSON:process.env.FIREBASE_SERVICE_ACCOUNT_JSON};if(process.env.SMS_ENCRYPTION_KEY)s.SMS_ENCRYPTION_KEY=process.env.SMS_ENCRYPTION_KEY;if(process.env.JJUMA_WEBHOOK_SECRET)s.JJUMA_WEBHOOK_SECRET=process.env.JJUMA_WEBHOOK_SECRET;fs.writeFileSync(process.env.RUNNER_TEMP+"/worker-secrets.json",JSON.stringify(s),{mode:0o600});'
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
# SMS encryption secret is injected from INTERCAMPUS_SMS_ENCRYPTION_KEY.
