name: Validate InterCampus before deployment

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - safeguard/intercampus-uiCT-reference
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing firebase
      - name: Check browser JavaScript syntax
        run: node --input-type=module --check < app.js
      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Firestore security-rule tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-intercampus --config firebase.json "node tests/firestore.rules.test.mjs"
